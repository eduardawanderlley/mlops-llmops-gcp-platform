name: LLMOps Platform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

env:
  GCP_PROJECT_ID: "genai-mlops-platform"
  GCP_REGION: "us-central1"
  ARTIFACT_REPO: "llmops-container-repo"
  AGENT_SERVICE_NAME: "llmops-agent-service"
  MCP_SERVICE_NAME: "llmops-mcp-server"

jobs:
  test-and-lint:
    name: Code Verification & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest --verbose tests/

  build-and-deploy-gcp:
    name: Build & Deploy Microservices to GCP Cloud Run
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          # Workload Identity Provider configuration or service account key secret
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 460.0.0"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Agent Container Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/agent-service:${{ github.sha }}"
          LATEST_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/agent-service:latest"
          
          docker build -t $IMAGE_URI -t $LATEST_URI -f docker/Dockerfile.agent .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Build & Push MCP Server Container Image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/mcp-server:${{ github.sha }}"
          LATEST_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/mcp-server:latest"
          
          docker build -t $IMAGE_URI -t $LATEST_URI -f docker/Dockerfile.mcp .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy Agent Service to Cloud Run
        run: |
          gcloud run deploy ${{ env.AGENT_SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/agent-service:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars ENV=prod,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }}

      - name: Deploy MCP Server to Cloud Run
        run: |
          gcloud run deploy ${{ env.MCP_SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/mcp-server:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars ENV=prod,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }}

      - name: Compile & Trigger Vertex AI Evaluation Pipeline
        run: |
          python pipelines/compile_pipelines.py
          gcloud ai pipelines run \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --display-name="llmops-eval-ci-${{ github.sha }}" \
            --pipeline-spec-filename=pipelines/prompt_eval_pipeline.json || true
